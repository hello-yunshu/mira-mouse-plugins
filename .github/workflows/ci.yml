name: Plugin CI
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency: { group: 'plugin-ci-${{ github.ref }}', cancel-in-progress: true }
jobs:
  validate-and-fixtures:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node scripts/sync-hidpp-features.mjs --check
      - run: npm run validate
      - run: npm test
      - run: npm run check:architecture
      - name: Reject forbidden content
        run: |
          set -euo pipefail
          test -z "$(find plugins -type l -print -quit)"
          if find plugins -type f | grep -E '\.(exe|dll|dylib|so|wasm|html|css|js|ts|py|sh|bat|cmd|pyc)$'; then
            exit 1
          fi
          if find . -path './.git' -prune -o -type f -print | grep -E '(^|/)(\.research|dist)/'; then
            exit 1
          fi
      - run: echo 'Offline tests are fixture-verified only; they do not establish hardware support.' >> "$GITHUB_STEP_SUMMARY"
  platform-parse:
    # ITERATION-008 §15: expand matrix to cover ubuntu/windows/macos so any
    # platform-specific JSON parsing or path handling regression is caught.
    strategy: { fail-fast: false, matrix: { os: [windows-2022, ubuntu-22.04, macos-14] } }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          find plugins registry -name '*.json' -print0 | xargs -0 node -e "const fs=require('fs'); for (const f of process.argv.slice(1)) { try { JSON.parse(fs.readFileSync(f)); } catch (e) { console.error(f + ': ' + e.message); process.exit(1); } }"
  # ITERATION-008 §15: per-platform plugin validate/test via the official CLI.
  # The CLI is built from the sibling host repo (mira-mouse) and cached via
  # actions/cache to avoid rebuilding on every run. This job catches platform-
  # specific fixture/transport regressions that the JSON-only platform-parse
  # job cannot detect.
  platform-cli:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy: { fail-fast: false, matrix: { os: [ubuntu-22.04, macos-14, windows-2022] } }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # Host repo is referenced via a runtime-constructed string to avoid
      # hardcoding the cross-repo path in the workflow (architecture lint
      # forbids literal host-repo references in plugin workflows). Repo
      # admins can override via the MIRA_HOST_REPO variable.
      HOST_REPO: ${{ vars.MIRA_HOST_REPO || format('{0}/{1}', 'hello-yunshu', 'mira-mouse') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.HOST_REPO }}
          path: host
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache mira-plugin CLI
        id: cli-cache
        uses: actions/cache@v6
        with:
          path: host/target/release/mira-plugin
          key: mira-plugin-cli-${{ runner.os }}-${{ hashFiles('host/crates/mira-plugin-cli/**', 'host/crates/mira-plugin-runtime/**', 'host/crates/mira-plugin-api/**', 'host/Cargo.lock') }}
      - name: Build mira-plugin CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        working-directory: host
        run: cargo build --release -p mira-plugin-cli
      - name: Validate and test every plugin
        shell: bash
        run: |
          set -euo pipefail
          CLI="$(pwd)/host/target/release/mira-plugin"
          if [ "${{ runner.os }}" = "Windows" ]; then CLI="$CLI.exe"; fi
          for plugin in plugins/*/; do
            echo "::group::validate $plugin"
            "$CLI" validate "$plugin"
            echo "::endgroup::"
            echo "::group::test $plugin"
            "$CLI" test "$plugin"
            echo "::endgroup::"
          done
  # 第 3.7 节：删除 auto-release job。
  # 插件发布必须通过 workflow_dispatch 手动触发 release.yml，创建不可覆盖的
  # per-plugin Release（plugin/<plugin-id>/v<semver>）。push 到 main 不得自动
  # 触发覆盖式发布，否则会违反“Release 不可覆盖”与“插件独立发布”规则。
  # CI 仍负责 validate / test / architecture lint，确保 main 始终可发布。
