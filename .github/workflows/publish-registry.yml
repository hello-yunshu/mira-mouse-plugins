# SPDX-License-Identifier: CC0-1.0
name: Publish Plugin Registry
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag: { description: 'Published release tag', required: true, type: string }
permissions:
  contents: write
concurrency:
  group: plugin-registry
  cancel-in-progress: false
jobs:
  publish:
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'plugin/')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Download and verify all published packages
        env:
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ github.event.release.tag_name || inputs.release_tag }}'
          REPO: '${{ github.repository }}'
        run: |
          set -euo pipefail
          mkdir -p release-asset
          gh release download "$TAG" --repo "$REPO" --dir release-asset \
            --pattern '*.mira-plugin' --pattern '*.mira-plugin.sha256'
          # Verify checksums for every asset
          for asset in release-asset/*.mira-plugin; do
            checksum="$asset.sha256"
            test -f "$asset" && test -f "$checksum"
            expected="$(tr -d '[:space:]' < "$checksum")"
            actual="$(sha256sum "$asset" | awk '{print $1}')"
            test "$expected" = "$actual"
            unzip -p "$asset" plugin.json > "$asset.plugin.json"
          done
          echo "Verified $(find release-asset -name '*.mira-plugin' | wc -l) plugin assets (SHA-256)"
      - name: Cache mira-plugin-cli
        uses: actions/cache@v6
        with:
          path: .cache/mira-plugin-cli
          key: mira-plugin-cli-${{ hashFiles('mira-plugin-cli.version.json') }}
      - name: Fetch mira-plugin CLI (official verifier)
        run: |
          set -euo pipefail
          # ITERATION-004 §2.6：Registry 发布前必须调用唯一正式 `mira-plugin verify`。
          # 不能依赖第二套不完整 Node verifier 作为生产真相。
          # fetch-cli.mjs 读取 mira-plugin-cli.version.json 下载并校验固定版本二进制。
          # fetch-cli emits human-readable integrity logs before the final path.
          # Only the last line is the machine-readable executable path.
          CLI_PATH="$(node scripts/fetch-cli.mjs | tail -n 1)"
          echo "mira-plugin CLI: $CLI_PATH"
          echo "MIRA_PLUGIN_CLI=$CLI_PATH" >> "$GITHUB_ENV"
      - name: Verify each plugin package with official mira-plugin verify
        run: |
          set -euo pipefail
          # ITERATION-004 §2.6：正式 CLI verify 覆盖 checksums、signature、trusted key、
          # key activation/revocation、allowlist、forbidden files、duplicate entries、
          # path traversal、package format、plugin API、minimum host。
          # 退出码 0 表示通过，非 0 表示失败（CI 门禁）。
          for asset in release-asset/*.mira-plugin; do
            echo "Official verify: $asset"
            "$MIRA_PLUGIN_CLI" verify "$asset" \
              --trusted-keys registry/trusted-keys.json \
              --require-signature
          done
          echo "All plugin packages verified by official mira-plugin verify"
      - name: Fetch asset URLs from release
        env:
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ github.event.release.tag_name || inputs.release_tag }}'
          REPO: '${{ github.repository }}'
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name | endswith(".mira-plugin")) | .browser_download_url + " " + .name' > release-asset/asset-urls.txt
          cat release-asset/asset-urls.txt
      - name: Update registry for all plugins
        env:
          RELEASE_TAG: '${{ github.event.release.tag_name || inputs.release_tag }}'
        run: |
          set -euo pipefail
          batch=$(node -e '
            const fs = require("fs");
            const lines = fs.readFileSync("release-asset/asset-urls.txt", "utf8").trim().split("\n").filter(Boolean);
            const items = lines.map(line => {
              const [url, name] = line.split(" ");
              const asset = "release-asset/" + name;
              const sha256 = fs.readFileSync(asset + ".sha256", "utf8").replace(/\s/g, "");
              console.error("Collecting " + name + " ...");
              return { url, manifest: asset + ".plugin.json", sha256 };
            });
            process.stdout.write(JSON.stringify(items));
          ')
          node scripts/update-registry.mjs registry/index.json --batch "$batch"
      - name: Sign registry with Ed25519 detached signature
        env:
          REGISTRY_SIGNING_KEY: '${{ secrets.REGISTRY_SIGNING_KEY }}'
          REGISTRY_KEY_ID: 'mira-plugins-2026-001'
        run: |
          set -euo pipefail
          if [ -z "$REGISTRY_SIGNING_KEY" ]; then
            echo "REGISTRY_SIGNING_KEY secret is required to publish a signed registry (3.8)" >&2
            exit 1
          fi
          node scripts/sign-registry.mjs registry/index.json
      - name: Verify registry signature against trusted keys
        run: |
          set -euo pipefail
          node scripts/verify-registry.mjs registry/index.json registry/trusted-keys.json
      - run: npm run validate && npm test
      - name: Commit immutable registry metadata
        env:
          TAG: '${{ github.event.release.tag_name || inputs.release_tag }}'
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add registry/index.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(registry): publish $TAG"
          git push origin HEAD:main
